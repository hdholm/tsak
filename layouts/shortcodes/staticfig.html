{{- /* Figure for a file under static/, honoring the site's base path.
       Usage: {{< staticfig src="images/foo.webp" title="Caption" alt="Description" float="left" width="50px">}} */ -}}
<figure {{ if or (isset .Params "float")  (isset .Params "width") }} style="{{ if isset .Params "width" }} width:{{ .Get "width" | safe.CSS }}; {{ end }} {{ if isset .Params "float" }} float:{{ .Get "float" | safe.CSS }}; {{ end }}" {{ end }}>
    <img src="{{ .Get "src" | relURL }}" alt="{{ .Get "alt" | default ( .Get "title") }}" loading="lazy">
  {{ with .Get "title" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
