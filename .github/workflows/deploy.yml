name: Deploy via SCP

on:
  push:
    branches:
      - main  # Trigger deployment when pushing to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y hugo

     - name: Build the site
        run: |
          cd tsak
          hugo build
          rm -f robots.txt
          rm -f sitemap.xml

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Automatically trust the remote host to avoid prompts
          echo ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy files with Rsync
        run: |
          rsync -avz --delete \
            ./public/* \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:secure_html/tsak/

