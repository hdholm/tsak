name: Deploy via SCP

on:
  push:
    branches:
      - main  # Trigger deployment when pushing to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        
      - name: Install Hugo
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo snap install hugo

      - name: Set up Node.js for Pagefind
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the site
        run: |
          hugo build
          pwd
          rm -fv public/robots.txt
          rm -fv public/sitemap.xml

      - name: Build Pagefind search index
        run: npx -y pagefind@1.5.2 --site public

      - name: Configure SSH for rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Automatically trust the remote host to avoid prompts
          echo "${{ secrets.KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Deploy site with rsync
        run: |
          rsync -avzc --delete \
            ./public/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:secure_html/tsak/

