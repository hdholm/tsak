<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 525" role="img" aria-labelledby="title desc"><title id="title">Land area does not measure voter support</title><desc id="desc">Two hypothetical regions. Red has 80% of land but 20% of voters; Blue has 20% of land but 80% of voters.</desc><rect width="1100" height="525" fill="#faf8f3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="44" y="58" font-size="32" fill="#172c3b" font-weight="bold">Land area does not measure voter support</text><text x="44" y="102" font-size="21" fill="#4c6170" font-weight="normal">Hypothetical example • not a map of election results</text><text x="44" y="155" font-size="25" fill="#172c3b" font-weight="bold">Share of land area</text><rect x="44" y="180" width="800.0" height="64" rx="0" fill="#bc512b"/><rect x="844.0" y="180" width="200.0" height="64" rx="0" fill="#166a80"/><text x="60" y="222" font-size="25" fill="white" font-weight="bold">Red 80%</text><text x="860.0" y="222" font-size="25" fill="white" font-weight="bold">Blue 20%</text><text x="44" y="310" font-size="25" fill="#172c3b" font-weight="bold">Share of voters</text><rect x="44" y="335" width="200.0" height="64" rx="0" fill="#bc512b"/><rect x="244.0" y="335" width="800.0" height="64" rx="0" fill="#166a80"/><text x="60" y="377" font-size="25" fill="white" font-weight="bold">Red 20%</text><text x="260.0" y="377" font-size="25" fill="white" font-weight="bold">Blue 80%</text><text x="44" y="475" font-size="24" fill="#172c3b" font-weight="bold">Same regions. Different denominators. Different visual story.</text></g></svg>