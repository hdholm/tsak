<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Same voters, different representation</title><desc id="desc">Five identical single-member districts elect five A representatives. One five-seat STV district elects three A and two B under party-cohesive rankings with sufficient candidates.</desc><rect width="1100" height="660" fill="#faf8f3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="44" y="58" font-size="32" fill="#172c3b" font-weight="bold">Same voters, different representation</text><text x="44" y="102" font-size="24" fill="#4c6170" font-weight="normal">Hypothetical electorate: 60% Party A • 40% Party B</text><text x="44" y="159" font-size="27" fill="#172c3b" font-weight="bold">Five single-member districts</text><text x="44" y="195" font-size="21" fill="#172c3b" font-weight="normal">Each district: A 60%, B 40%. Each elects one A representative.</text><rect x="44" y="219" width="186" height="68" rx="8" fill="#166a80"/><text x="109" y="264" font-size="32" fill="white" font-weight="bold">A</text><rect x="246" y="219" width="186" height="68" rx="8" fill="#166a80"/><text x="311" y="264" font-size="32" fill="white" font-weight="bold">A</text><rect x="448" y="219" width="186" height="68" rx="8" fill="#166a80"/><text x="513" y="264" font-size="32" fill="white" font-weight="bold">A</text><rect x="650" y="219" width="186" height="68" rx="8" fill="#166a80"/><text x="715" y="264" font-size="32" fill="white" font-weight="bold">A</text><rect x="852" y="219" width="186" height="68" rx="8" fill="#166a80"/><text x="917" y="264" font-size="32" fill="white" font-weight="bold">A</text><text x="44" y="325" font-size="25" fill="#172c3b" font-weight="bold">Result: A 5 seats (100%) • B 0 seats</text><text x="44" y="399" font-size="27" fill="#172c3b" font-weight="bold">One five-seat STV district</text><text x="44" y="435" font-size="21" fill="#172c3b" font-weight="normal">Voters rank their party’s candidates first; sufficient candidates run.</text><rect x="44" y="459" width="186" height="68" rx="8" fill="#166a80"/><text x="109" y="504" font-size="32" fill="white" font-weight="bold">A</text><rect x="246" y="459" width="186" height="68" rx="8" fill="#166a80"/><text x="311" y="504" font-size="32" fill="white" font-weight="bold">A</text><rect x="448" y="459" width="186" height="68" rx="8" fill="#166a80"/><text x="513" y="504" font-size="32" fill="white" font-weight="bold">A</text><rect x="650" y="459" width="186" height="68" rx="8" fill="#bc512b"/><text x="715" y="504" font-size="32" fill="white" font-weight="bold">B</text><rect x="852" y="459" width="186" height="68" rx="8" fill="#bc512b"/><text x="917" y="504" font-size="32" fill="white" font-weight="bold">B</text><text x="44" y="565" font-size="25" fill="#172c3b" font-weight="bold">Result: A 3 seats (60%) • B 2 seats (40%)</text><text x="44" y="617" font-size="20" fill="#4c6170" font-weight="normal">Illustration under stated assumptions, not an empirical forecast.</text></g></svg>