<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc"><title id="title">How packing and cracking change seat totals</title><desc id="desc">100 voters, A60 and B40, grouped into five districts of 20. First arrangement: three all-A and two all-B districts. Second: four A15/B5 districts and one all-B district. Seats change from A3/B2 to A4/B1.</desc><rect width="1100" height="780" fill="#faf8f3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="44" y="58" font-size="32" fill="#172c3b" font-weight="bold">How packing and cracking change seat totals</text><text x="44" y="102" font-size="23" fill="#4c6170" font-weight="normal">Same 100 voters: A 60 • B 40. Five districts of 20 voters each.</text><text x="44" y="158" font-size="25" fill="#172c3b" font-weight="bold">Arrangement 1: three A seats, two B seats</text><rect x="44" y="183" width="186" height="115" rx="8" fill="#e9efef"/><circle cx="64" cy="206" r="9" fill="#166a80"/><circle cx="99" cy="206" r="9" fill="#166a80"/><circle cx="134" cy="206" r="9" fill="#166a80"/><circle cx="169" cy="206" r="9" fill="#166a80"/><circle cx="204" cy="206" r="9" fill="#166a80"/><circle cx="64" cy="230" r="9" fill="#166a80"/><circle cx="99" cy="230" r="9" fill="#166a80"/><circle cx="134" cy="230" r="9" fill="#166a80"/><circle cx="169" cy="230" r="9" fill="#166a80"/><circle cx="204" cy="230" r="9" fill="#166a80"/><circle cx="64" cy="254" r="9" fill="#166a80"/><circle cx="99" cy="254" r="9" fill="#166a80"/><circle cx="134" cy="254" r="9" fill="#166a80"/><circle cx="169" cy="254" r="9" fill="#166a80"/><circle cx="204" cy="254" r="9" fill="#166a80"/><circle cx="64" cy="278" r="9" fill="#166a80"/><circle cx="99" cy="278" r="9" fill="#166a80"/><circle cx="134" cy="278" r="9" fill="#166a80"/><circle cx="169" cy="278" r="9" fill="#166a80"/><circle cx="204" cy="278" r="9" fill="#166a80"/><text x="44" y="332" font-size="22" fill="#172c3b" font-weight="normal">A 20 / B 0</text><rect x="246" y="