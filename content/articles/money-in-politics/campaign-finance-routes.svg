<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 735" role="img" aria-labelledby="title desc"><title id="title">Two routes, different legal rules</title><desc id="desc">Direct candidate contributions face source restrictions and limits. Independent expenditure-only groups may accept unlimited lawful-source funding but must not coordinate. Citizens United and SpeechNow are distinct.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#166a80"/></marker></defs><rect width="1100" height="735" fill="#faf8f3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="44" y="59" font-size="32" fill="#172c3b" font-weight="bold">Two routes, different legal rules</text><text x="44" y="105" font-size="22" fill="#4c6170" font-weight="normal">Simplified federal framework • lawful funding sources still matter</text><rect x="44" y="150" width="484" height="387" rx="12" fill="#e9efef"/><text x="64" y="197" font-size="23" fill="#166a80" font-weight="bold">Direct candidate contributions</text><text x="64" y="244" font-size="22" fill="#172c3b" font-weight="normal">Money goes to the candidate’s</text><text x="64" y="278" font-size="22" fill="#172c3b" font-weight="normal">authorized campaign.</text><text x="64" y="312" font-size="22" fill="#172c3b" font-weight="normal"></text><text x="64" y="346" font-size="22" fill="#172c3b" font-weight="normal">Source restrictions and applicable</text><text x="64" y="380" font-size="22" fill="#172c3b" font-weight="normal">contribution limits govern.</text><text x="64" y="414" font-size="22" fill="#172c3b" font-weight="normal"></text><text x="64" y="448" font-size="22" fill="#172c3b" font-weight="normal">Corporate treasury contributions</text><text x="64" y="482" font-size="22" fill="#172c3b" font-weight="normal">directly to candidates are prohibited.</text><rect x="572" y="150" width="484" height="387" rx="12" fill="#e9efef"/><text x="592" y="197" font-size="23" fill="#bc512b" font-weight="bold">Independent spending</text><text x="592" y="244" font-size="22" fill="#172c3b" font-weight="normal">Spending advocates an electoral</text><text x="592" y="278" font-size="22" fill="#172c3b" font-weight="normal">outcome outside the campaign.</text><text x="592" y="312" font-size="22" fill="#172c3b" font-weight="normal"></text><text x="592" y="346" font-size="22" fill="#172c3b" font-weight="normal">Super PACs may receive unlimited</text><text x="592" y="380" font-size="22" fill="#172c3b" font-weight="normal">contributions from lawful sources.</text><text x="592" y="414" font-size="22" fill="#172c3b" font-weight="normal"></text><text x="592" y="448" font-size="22" fill="#172c3b" font-weight="normal">Coordination can convert spending</text><text x="592" y="482" font-size="22" fill="#172c3b" font-weight="normal">into a regulated contribution.</text><text x="44" y="595" font-size="23" fill="#172c3b" font-weight="bold">Citizens United: corporate independent spending.</text><text x="44" y="635" font-size="23" fill="#172c3b" font-weight="bold">SpeechNow: contributions to independent-expenditure-only groups.</text><text x="44" y="689" font-size="20" fill="#4c6170" font-weight="normal">Source: FEC case summaries and independent-expenditure guidance.</text></g></svg>