<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc"><title id="title">Make a small contribution more consequential</title><desc id="desc">An eligible 25-dollar contribution matched eight to one receives 200 dollars in public funds for a total of 225. Program conditions apply. Based on NYC matching rate.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#166a80"/></marker></defs><rect width="1100" height="640" fill="#faf8f3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="44" y="59" font-size="32" fill="#172c3b" font-weight="bold">Make a small contribution more consequential</text><text x="44" y="105" font-size="23" fill="#4c6170" font-weight="normal">Arithmetic illustration using NYC’s 8-to-1 matching rate</text><rect x="44" y="160" width="326" height="160" rx="12" fill="#e9efef"/><text x="68" y="210" font-size="42" fill="#166a80" font-weight="bold">$25</text><text x="68" y="263" font-size="22" fill="#172c3b" font-weight="normal">Qualifying private gift</text><text x="399" y="250" font-size="42" fill="#172c3b" font-weight="bold">+</text><rect x="455" y="160" width="590" height="160" rx="12" fill="#e9efef"/><text x="479" y="210" font-size="42" fill="#166a80" font-weight="bold">$200</text><text x="479" y="263" font-size="23" fill="#172c3b" font-weight="normal">Public match: 8 × $25</text><rect x="44" y="369" width="1001" height="115" rx="12" fill="#166a80"/><text x="68" y="438" font-size="30" fill="white" font-weight="bold">$225 available to the participating campaign</text><text x="44" y="552" font-size="22" fill="#172c3b" font-weight="normal">Qualification, eligible-donor rules, and payment caps apply.</text><text x="44" y="593" font-size="19" fill="#4c6170" font-weight="normal">Source: New York City Campaign Finance Board. Not an automatic payment.</text></g></svg>