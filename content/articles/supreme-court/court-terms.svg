<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 719" role="img" aria-labelledby="title desc"><title id="title">Nine seats, predictable turnover</title><desc id="desc">Nine scheduled slot expirations occur at years 2 4 6 8 10 12 14 16 and 18. New full terms last eighteen years. Proposed steady state only.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#166a80"/></marker></defs><rect width="1100" height="719" fill="#faf8f3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="44" y="59" font-size="32" fill="#172c3b" font-weight="bold">Nine seats, predictable turnover</text><text x="44" y="105" font-size="23" fill="#4c6170" font-weight="normal">Proposed steady state: nine fixed slots • full terms last 18 years</text><rect x="44" y="151" width="324" height="118" rx="12" fill="#e9efef"/><text x="64" y="191" font-size="23" fill="#172c3b" font-weight="bold">Seat slot 1</text><text x="64" y="238" font-size="29" fill="#166a80" font-weight="bold">Due at year 2</text><rect x="387" y="151" width="324" height="118" rx="12" fill="#e9efef"/><text x="407" y="191" font-size="23" fill="#172c3b" font-weight="bold">Seat slot 2</text><text x="407" y="238" font-size="29" fill="#166a80" font-weight="bold">Due at year 4</text><rect x="730" y="151" width="324" height="118" rx="12" fill="#e9efef"/><text x="750" y="191" font-size="23" fill="#172c3b" font-weight="bold">Seat slot 3</text><text x="750" y="238" font-size="29" fill="#166a80" font-weight="bold">Due at year 6</text><rect x="44" y="296" width="324" height="118" rx="12" fill="#e9efef"/><text x="64" y="336" font-size="23" fill="#172c3b" font-weight="bold">Seat slot 4</text><text x="64" y="383" font-size="29" fill="#166a80" font-weight="bold">Due at year 8</text><rect x="387" y="296" width="324" height="118" rx="12" fill="#e9efef"/><text x="407" y="336" font-size="23" fill="#172c3b" font-weight="bold">Seat slot 5</text><text x="407" y="383" font-size="29" fill="#166a80" font-weight="bold">Due at year 10</text><rect x="730" y="296" width="324" height="118" rx="12" fill="#e9efef"/><text x="750" y="336" font-size="23" fill="#172c3b" font-weight="bold">Seat slot 6</text><text x="750" y="383" font-size="29" fill="#166a80" font-weight="bold">Due at year 12</text><rect x="44" y="441" width="324" height="118" rx="12" fill="#e9efef"/><text x="64" y="481" font-size="23" fill="#172c3b" font-weight="bold">Seat slot 7</text><text x="64" y="528" font-size="29" fill="#166a80" font-weight="bold">Due at year 14</text><rect x="387" y="441" width="324" height="118" rx="12" fill="#e9efef"/><text x="407" y="481" font-size="23" fill="#172c3b" font-weight="bold">Seat slot 8</text><text x="407" y="528" font-size="29" fill="#166a80" font-weight="bold">Due at year 16</text><rect x="730" y="441" width="324" height="118" rx="12" fill="#e9efef"/><text x="750" y="481" font-size="23" fill="#172c3b" font-weight="bold">Seat slot 9</text><text x="750" y="528" font-size="29" fill="#166a80" font-weight="bold">Due at year 18</text><text x="44" y="632" font-size="22" fill="#172c3b" font-weight="normal">One scheduled nomination every two years, subject to confirmation.</text><text x="44" y="674" font-size="20" fill="#4c6170" font-weight="normal">Illustration only. Transition, early vacancies, and delay need rules.</text></g></svg>