<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 896" role="img" aria-labelledby="title desc"><title id="title">Rules need a credible enforcement process</title><desc id="desc">A proposed process: complaint or conflict flag, independent screening, investigation with a right to respond, reasoned decision and review. No invented removal authority.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#166a80"/></marker></defs><rect width="1100" height="896" fill="#faf8f3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="44" y="59" font-size="32" fill="#172c3b" font-weight="bold">Rules need a credible enforcement process</text><text x="44" y="105" font-size="22" fill="#4c6170" font-weight="normal">Proposed oversight • conduct is reviewed separately from rulings</text><rect x="44" y="150" width="1008" height="131" rx="12" fill="#e9efef"/><text x="68" y="189" font-size="25" fill="#166a80" font-weight="bold">Complaint or conflict flag</text><text x="68" y="227" font-size="22" fill="#172c3b" font-weight="normal">Defined filing rules; conflicts may also</text><text x="68" y="261" font-size="22" fill="#172c3b" font-weight="normal">be identified before a case is heard.</text><path d="M548,284 L548,310" fill="none" stroke="#166a80" stroke-width="4" marker-end="url(#arrow)"/><rect x="44" y="314" width="1008" height="131" rx="12" fill="#e9efef"/><text x="68" y="353" font-size="25" fill="#166a80" font-weight="bold">Independent screening</text><text x="68" y="391" font-size="22" fill="#172c3b" font-weight="normal">Dismiss unsupported or abusive claims;</text><text x="68" y="425" font-size="22" fill="#172c3b" font-weight="normal">refer warranted concerns for investigation.</text><path d="M548,448 L548,474" fill="none" stroke="#166a80" stroke-width="4" marker-end="url(#arrow)"/><rect x="44" y="478" width="1008" height="131" rx="12" fill="#e9efef"/><text x="68" y="517" font-size="25" fill="#166a80" font-weight="bold">Investigation and response</text><text x="68" y="555" font-size="22" fill="#172c3b" font-weight="normal">Gather evidence; give the justice notice</text><text x="68" y="589" font-size="22" fill="#172c3b" font-weight="normal">and a meaningful opportunity to respond.</text><path d="M548,612 L548,638" fill="none" stroke="#166a80" stroke-width="4" marker-end="url(#arrow)"/><rect x="44" y="642" width="1008" height="131" rx="12" fill="#e9efef"/><text x="68" y="681" font-size="25" fill="#166a80" font-weight="bold">Reasoned decision and review</text><text x="68" y="719" font-size="22" fill="#172c3b" font-weight="normal">Publish findings and appropriate remedies;</text><text x="68" y="753" font-size="22" fill="#172c3b" font-weight="normal">provide a defined route for review.</text><text x="44" y="851" font-size="21" fill="#4c6170" font-weight="normal">No administrative removal power; constitutional limits still apply.</text></g></svg>