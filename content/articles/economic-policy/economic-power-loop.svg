<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 704" role="img" aria-labelledby="title desc"><title id="title">When market power reinforces political power</title><desc id="desc">Conceptual feedback loop: market power to resources to political influence to favorable rules and back to market power. Proposed checks target each link.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#166a80"/></marker></defs><rect width="1100" height="704" fill="#faf8f3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="44" y="59" font-size="32" fill="#172c3b" font-weight="bold">When market power reinforces political power</text><text x="44" y="105" font-size="22" fill="#4c6170" font-weight="normal">A feedback mechanism to examine, not proof about any single firm</text><rect x="44" y="162" width="460" height="181" rx="12" fill="#e9efef"/><text x="66" y="211" font-size="26" fill="#166a80" font-weight="bold">Market power</text><text x="66" y="263" font-size="22" fill="#172c3b" font-weight="normal">Protected positions can sustain</text><text x="66" y="297" font-size="22" fill="#172c3b" font-weight="normal">financial returns.</text><rect x="594" y="162" width="460" height="181" rx="12" fill="#e9efef"/><text x="616" y="211" font-size="26" fill="#166a80" font-weight="bold">Financial resources</text><text x="616" y="263" font-size="22" fill="#172c3b" font-weight="normal">Returns can finance lobbying,</text><text x="616" y="297" font-size="22" fill="#172c3b" font-weight="normal">election spending, and litigation.</text><rect x="594" y="414" width="460" height="181" rx="12" fill="#e9efef"/><text x="616" y="463" font-size="26" fill="#166a80" font-weight="bold">Political influence</text><text x="616" y="515" font-size="22" fill="#172c3b" font-weight="normal">Resources can shape access,</text><text x="616" y="549" font-size="22" fill="#172c3b" font-weight="normal">agendas, and enforcement.</text><rect x="44" y="414" width="460" height="181" rx="12" fill="#e9efef"/><text x="66" y="463" font-size="26" fill="#166a80" font-weight="bold">Favorable rules</text><text x="66" y="515" font-size="22" fill="#172c3b" font-weight="normal">Rules can protect incumbents</text><text x="66" y="549" font-size="22" fill="#172c3b" font-weight="normal">and weaken alternatives.</text><path d="M509,253 L584,253" fill="none" stroke="#166a80" stroke-width="4" marker-end="url(#arrow)"/><path d="M824,351 L824,404" fill="none" stroke="#166a80" stroke-width="4" marker-end="url(#arrow)"/><path d="M584,505 L514,505" fill="none" stroke="#166a80" stroke-width="4" marker-end="url(#arrow)"/><path d="M274,404 L274,353" fill="none" stroke="#166a80" stroke-width="4" marker-end="url(#arrow)"/><text x="44" y="657" font-size="21" fill="#172c3b" font-weight="bold">Guardrails: competition, disclosure, conflict rules, and public accountability.</text></g></svg>