<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 627" role="img" aria-labelledby="title desc"><title id="title">Profit and public benefit are different tests</title><desc id="desc">Conceptual comparison: creating value through improved products, productivity and choice versus extracting through lock-in, few alternatives, tolls and cost shifting.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#166a80"/></marker></defs><rect width="1100" height="627" fill="#faf8f3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="44" y="59" font-size="32" fill="#172c3b" font-weight="bold">Profit and public benefit are different tests</text><text x="44" y="105" font-size="23" fill="#4c6170" font-weight="normal">An analytical distinction • real businesses can do both</text><rect x="44" y="151" width="484" height="318" rx="12" fill="#e9efef"/><text x="66" y="205" font-size="29" fill="#166a80" font-weight="bold">Creating value</text><text x="66" y="270" font-size="22" fill="#172c3b" font-weight="normal">Improve products and services</text><text x="66" y="304" font-size="22" fill="#172c3b" font-weight="normal">Raise quality or productivity</text><text x="66" y="338" font-size="22" fill="#172c3b" font-weight="normal">Offer useful new choices</text><text x="66" y="372" font-size="22" fill="#172c3b" font-weight="normal">Compete on a better deal</text><rect x="572" y="151" width="484" height="318" rx="12" fill="#e9efef"/><text x="594" y="205" font-size="29" fill="#bc512b" font-weight="bold">Extracting value</text><text x="594" y="270" font-size="22" fill="#172c3b" font-weight="normal">Make switching or repair difficult</text><text x="594" y="304" font-size="22" fill="#172c3b" font-weight="normal">Exploit a lack of alternatives</text><text x="594" y="338" font-size="22" fill="#172c3b" font-weight="normal">Impose tolls on dependent sellers</text><text x="594" y="372" font-size="22" fill="#172c3b" font-weight="normal">Shift costs and risks to others</text><text x="44" y="530" font-size="24" fill="#172c3b" font-weight="bold">A higher profit does not tell us which mechanism produced it.</text><text x="44" y="578" font-size="20" fill="#4c6170" font-weight="normal">Conceptual illustration, not a scorecard for any particular company.</text></g></svg>