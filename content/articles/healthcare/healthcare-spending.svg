<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 472" role="img" aria-labelledby="title desc"><title id="title">Enough spending to expect better</title><desc id="desc">2024 US national health spending: $5.3 trillion total, $15,474 per person, 18.0% of GDP. Source CMS.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#166a80"/></marker></defs><rect width="1100" height="472" fill="#faf8f3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="44" y="59" font-size="32" fill="#172c3b" font-weight="bold">Enough spending to expect better</text><text x="44" y="105" font-size="23" fill="#4c6170" font-weight="normal">U.S. national health expenditures • calendar year 2024</text><rect x="44" y="151" width="324" height="175" rx="12" fill="#e9efef"/><text x="66" y="218" font-size="34" fill="#166a80" font-weight="bold">$5.3 trillion</text><text x="66" y="272" font-size="24" fill="#172c3b" font-weight="bold">Total spending</text><rect x="387" y="151" width="324" height="175" rx="12" fill="#e9efef"/><text x="409" y="218" font-size="34" fill="#166a80" font-weight="bold">$15,474</text><text x="409" y="272" font-size="24" fill="#172c3b" font-weight="bold">Per person</text><rect x="730" y="151" width="324" height="175" rx="12" fill="#e9efef"/><text x="752" y="218" font-size="34" fill="#166a80" font-weight="bold">18.0%</text><text x="752" y="272" font-size="24" fill="#172c3b" font-weight="bold">Share of GDP</text><text x="44" y="384" font-size="22" fill="#172c3b" font-weight="normal">Three measures of the same spending; do not add them together.</text><text x="44" y="430" font-size="20" fill="#4c6170" font-weight="normal">Source: CMS National Health Expenditure Accounts, 2024.</text></g></svg>