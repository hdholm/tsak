<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 648" role="img" aria-labelledby="title desc"><title id="title">Coverage is a foundation, not the whole system</title><desc id="desc">Four proposed pillars: universal coverage, affordable care, available care, accountable administration.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#166a80"/></marker></defs><rect width="1100" height="648" fill="#faf8f3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="44" y="59" font-size="32" fill="#172c3b" font-weight="bold">Coverage is a foundation, not the whole system</text><text x="44" y="105" font-size="23" fill="#4c6170" font-weight="normal">Proposed design priorities • each pillar is necessary</text><rect x="44" y="147" width="492" height="173" rx="12" fill="#e9efef"/><text x="66" y="190" font-size="25" fill="#166a80" font-weight="bold">Universal coverage</text><text x="66" y="236" font-size="22" fill="#172c3b" font-weight="normal">Eligibility follows the person,</text><text x="66" y="270" font-size="22" fill="#172c3b" font-weight="normal">with a comprehensive benefit.</text><rect x="568" y="147" width="492" height="173" rx="12" fill="#e9efef"/><text x="590" y="190" font-size="25" fill="#166a80" font-weight="bold">Affordable care</text><text x="590" y="236" font-size="22" fill="#172c3b" font-weight="normal">Financing protects households</text><text x="590" y="270" font-size="22" fill="#172c3b" font-weight="normal">from medical financial hardship.</text><rect x="44" y="348" width="492" height="173" rx="12" fill="#e9efef"/><text x="66" y="391" font-size="25" fill="#166a80" font-weight="bold">Available care</text><text x="66" y="437" font-size="22" fill="#172c3b" font-weight="normal">Clinicians, facilities, and staffing</text><text x="66" y="471" font-size="22" fill="#172c3b" font-weight="normal">make treatment reachable.</text><rect x="568" y="348" width="492" height="173" rx="12" fill="#e9efef"/><text x="590" y="391" font-size="25" fill="#166a80" font-weight="bold">Accountable administration</text><text x="590" y="437" font-size="22" fill="#172c3b" font-weight="normal">Transparent decisions, usable</text><text x="590" y="471" font-size="22" fill="#172c3b" font-weight="normal">appeals, and independent review.</text><text x="44" y="601" font-size="25" fill="#172c3b" font-weight="bold">An insurance card cannot replace a clinician or a hospital.</text></g></svg>