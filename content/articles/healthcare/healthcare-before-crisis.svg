<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 808" role="img" aria-labelledby="title desc"><title id="title">Healthcare before crisis</title><desc id="desc">Conceptual comparison: financial barriers and weak primary care can delay management and contribute to crises. Universal affordable coverage and funded primary care can support earlier assessment and chronic care. Outcomes depend on implementation.</desc><defs><marker id="a0" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#bc512b"/></marker><marker id="a1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#bc512b"/></marker><marker id="a2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#166a80"/></marker><marker id="a3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#166a80"/></marker></defs><rect width="1100" height="808" fill="#faf8f3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="44" y="59" fill="#172c3b" font-size="32" font-weight="bold">Move care earlier, before a crisis</text><text x="44" y="105" fill="#4c6170" font-size="22" font-weight="normal">Conceptual pathways • outcomes depend on funding and access</text><text x="44" y="155" fill="#bc512b" font-size="26" font-weight="bold">A pattern of sick care</text><rect x="44" y="181" width="310" height="162" rx="12" fill="#e9efef"/><text x="60" y="225" fill="#bc512b" font-size="22" font-weight="bold">Barriers to care</text><text x="60" y="269" fill="#172c3b" font-size="19" font-weight="normal">Cost and coverage gaps</text><text x="60" y="301" fill="#172c3b" font-size="19" font-weight="normal">Weak primary care capacity</text><path d="M359,262 L385,262" stroke="#bc512b" stroke-width="4" marker-end="url(#a0)"/><rect x="393" y="181" width="310" height="162" rx="12" fill="#e9efef"/><text x="409" y="225" fill="#bc512b" font-size="22" font-weight="bold">Delayed management</text><text x="409" y="269" fill="#172c3b" font-size="19" font-weight="normal">Conditions left untreated</text><text x="409" y="301" fill="#172c3b" font-size="19" font-weight="normal">Gaps in continuing care</text><path d="M708,262 L734,262" stroke="#bc512b" stroke-width="4" marker-end="url(#a1)"/><rect x="742" y="181" width="310" height="162" rx="12" fill="#e9efef"/><text x="758" y="225" fill="#bc512b" font-size="22" font-weight="bold">Crisis-driven care</text><text x="758" y="269" fill="#172c3b" font-size="19" font-weight="normal">Avoidable deterioration</text><text x="758" y="301" fill="#172c3b" font-size="19" font-weight="normal">Pressure on emergency care</text><text x="44" y="424" fill="#166a80" font-size="26" font-weight="bold">A stronger healthcare foundation</text><rect x="44" y="450" width="310" height="162" rx="12" fill="#e9efef"/><text x="60" y="494" fill="#166a80" font-size="22" font-weight="bold">Coverage and capacity</text><text x="60" y="538" fill="#172c3b" font-size="19" font-weight="normal">Affordable universal coverage</text><text x="60" y="570" fill="#172c3b" font-size="19" font-weight="normal">Properly funded primary care</text><path d="M359,531 L385,531" stroke="#166a80" stroke-width="4" marker-end="url(#a2)"/><rect x="393" y="450" width="310" height="162" rx="12" fill="#e9efef"/><text x="409" y="494" fill="#166a80" font-size="22" font-weight="bold">Timely, continuing care</text><text x="409" y="538" fill="#172c3b" font-size="19" font-weight="normal">Earlier assessment</text><text x="409" y="570" fill="#172c3b" font-size="19" font-weight="normal">Reliable chronic care</text><path d="M708,531 L734,531" stroke="#166a80" stroke-width="4" marker-end="url(#a3)"/><rect x="742" y="450" width="310" height="162" rx="12" fill="#e9efef"/><text x="758" y="494" fill="#166a80" font-size="22" font-weight="bold">Better opportunity</text><text x="758" y="538" fill="#172c3b" font-size="19" font-weight="normal">Less avoidable deterioration</text><text x="758" y="570" fill="#172c3b" font-size="19" font-weight="normal">Capacity for necessary care</text><text x="44" y="681" fill="#172c3b" font-size="24" font-weight="bold">The goal: fewer avoidable crises, not less necessary treatment.</text><text x="44" y="724" fill="#4c6170" font-size="20" font-weight="normal">Coverage alone can increase care use initially; no reduction is guaranteed.</text><text x="44" y="764" fill="#4c6170" font-size="19" font-weight="normal">Basis: AHRQ primary care and preventable-admission work; NASEM (2021).</text></g></svg>